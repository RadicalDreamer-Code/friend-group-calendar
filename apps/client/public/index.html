<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the app draw under the notch; the layout adds the safe-area insets itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Shared calendars for your friend group: plan things together and see who's in." />

    <!-- Installable web app: added to the home screen, it opens without browser chrome. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Friend Cal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Browser chrome follows the device theme until the app applies the one picked in the app. -->
    <meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1918" media="(prefers-color-scheme: dark)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* The theme's background before the app has loaded, so a dark device does not flash white. */
      html,
      body {
        background-color: #faf9f7;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #1a1918;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Friend Calendar needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
