openapi: 3.1.0
info:
  title: Friend Group Calendar API
  version: 0.6.0
  description: |
    HTTP API for the friend group calendar. This file is the contract between
    services/api (Go) and apps/client (TypeScript). After changing it, run
    `npm run gen:api` in apps/client to regenerate the typed client.

    Authentication: web clients get an HttpOnly `session` cookie from
    POST /auth/verify; native apps get a token in the response body and send
    it as `Authorization: Bearer <token>`. Sessions last 90 days and are
    renewed while in use.

    Personal access tokens (`fgc_…`, /me/tokens) are for AI assistants and
    other MCP clients. Only the MCP endpoint at /mcp accepts them; it is not
    part of this REST API, and a token sent here leaves the request signed
    out.

    Every error response has the body `{"error": {"code", "message"}}`.
    `code` is stable and meant for the client to switch on.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose
security:
  - sessionCookie: []
  - bearer: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: API and database are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: API is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/request-code:
    post:
      operationId: requestCode
      summary: Email a 6-digit sign-in code
      description: |
        Returns a challenge ID that only this client receives; send it to
        /auth/verify together with the code. Codes expire after 10 minutes and
        allow 5 attempts, and stay valid when more codes are requested. The
        response is the same whether or not an account exists; the account is
        created on the first verify.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [challengeId]
                properties:
                  challengeId:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Error"

  /auth/verify:
    post:
      operationId: verifyCode
      summary: Exchange a code for a session
      description: |
        Error codes: `invalid_code` (wrong code, try again), `code_expired`
        (request a new code; also for an unknown challenge), `invalid_email`,
        `invalid_platform`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, email, code, platform]
              properties:
                challengeId:
                  type: string
                  format: uuid
                  description: From the /auth/request-code response.
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                platform:
                  $ref: "#/components/schemas/Platform"
                deviceName:
                  type: string
                  maxLength: 64
                  description: Shown in the device list. Derived from the user agent when omitted.
      responses:
        "200":
          description: Signed in. Web clients also receive the session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
                    description: Only for native platforms; keep it in secure storage.
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: Also succeeds without a session and always clears the cookie.
      responses:
        "204":
          description: Signed out

  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Update the profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  $ref: "#/components/schemas/Username"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: "`username_taken`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /username-availability:
    get:
      operationId: getUsernameAvailability
      summary: Check whether a username is free
      description: The caller's own current username counts as available.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /me/avatar:
    put:
      operationId: putAvatar
      summary: Upload a new avatar
      description: |
        JPEG, PNG, WebP or GIF up to 10 MB. The API center-crops it to a
        square, resizes it to 512 px and stores it as WebP.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAvatar
      summary: Remove the avatar
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"

  /me/sessions:
    get:
      operationId: listSessions
      summary: Devices that are signed in
      responses:
        "200":
          description: Active sessions, most recently used first
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"

  /me/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Sign one device out
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      summary: Sign out every other device
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Error"

  /me/tokens:
    get:
      operationId: listApiTokens
      summary: Personal access tokens that can still be used
      description: Never includes the tokens themselves. Needs a session; access tokens cannot manage tokens.
      responses:
        "200":
          description: Live tokens, newest first
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiToken"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiToken
      summary: Create a personal access token for the MCP endpoint
      description: |
        The token is in the response this one time and is never shown again.
        Error codes: `invalid_token_name`, `invalid_expiry`, `too_many_tokens`
        (10 live tokens), `rate_limited` (20 an hour).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                expiresInDays:
                  type: integer
                  enum: [30, 90, 365]
                  default: 90
      responses:
        "201":
          description: The new token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /me/tokens/{tokenId}:
    delete:
      operationId: revokeApiToken
      summary: Revoke a personal access token
      description: "Error codes: `not_found` (no such live token of the caller's)."
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /users/search:
    get:
      operationId: searchUsers
      summary: Find people by username
      description: |
        Prefix search: "ad" finds ada and adam. A leading @ is ignored. At most
        20 results, exact match first, then shorter usernames. Never includes
        the caller or people who have not picked a username yet.
        Error codes: `invalid_query` (not 2–20 username characters),
        `username_required` (the caller has no username yet), `rate_limited`
        (more than 120 searches in an hour).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching people with the caller's friendship to each
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [user, friendship]
                      properties:
                        user:
                          $ref: "#/components/schemas/Person"
                        friendship:
                          $ref: "#/components/schemas/FriendshipStatus"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /friends:
    get:
      operationId: listFriends
      summary: Friends and pending friend requests
      responses:
        "200":
          description: Friends by username; requests newest first
          content:
            application/json:
              schema:
                type: object
                required: [friends, incoming, outgoing]
                properties:
                  friends:
                    type: array
                    items:
                      $ref: "#/components/schemas/Friend"
                  incoming:
                    description: Requests to the caller, waiting for them to accept or decline.
                    type: array
                    items:
                      $ref: "#/components/schemas/FriendRequest"
                  outgoing:
                    description: Requests the caller sent that are still pending.
                    type: array
                    items:
                      $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /friends/{userId}:
    delete:
      operationId: removeFriend
      summary: End a friendship
      description: "Error codes: `not_friends`, `user_not_found` (malformed ID)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: No longer friends
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /friend-requests:
    post:
      operationId: sendFriendRequest
      summary: Ask someone to be friends
      description: |
        If they already asked the caller, this accepts their request and the
        result is `friends`. Sending again while a request is pending, or to a
        friend, changes nothing. Error codes: `user_not_found`,
        `cannot_add_self`, `rate_limited` (30 requests an hour, 3 a day to the
        same person).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The friendship afterwards
          content:
            application/json:
              schema:
                type: object
                required: [friendship]
                properties:
                  friendship:
                    type: string
                    enum: [outgoing, friends]
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /friend-requests/{userId}:
    delete:
      operationId: deleteFriendRequest
      summary: Decline a request from this user, or cancel one sent to them
      description: "Error codes: `request_not_found`, `user_not_found` (malformed ID)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Request deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /friend-requests/{userId}/accept:
    post:
      operationId: acceptFriendRequest
      summary: Accept the request this user sent
      description: "Error codes: `request_not_found`, `user_not_found` (malformed ID)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Now friends
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /calendars:
    get:
      operationId: listCalendars
      summary: The caller's calendars
      responses:
        "200":
          description: Calendars the caller is a member of, by name
          content:
            application/json:
              schema:
                type: object
                required: [calendars]
                properties:
                  calendars:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarSummary"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createCalendar
      summary: Create a calendar owned by the caller
      description: "Error codes: `invalid_name`, `too_many_calendars` (50 owned)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  $ref: "#/components/schemas/CalendarName"
      responses:
        "201":
          description: The new calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /calendars/{calendarId}:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
    get:
      operationId: getCalendar
      summary: A calendar with all its members
      description: "`calendar_not_found` also when the caller is not a member."
      responses:
        "200":
          description: The calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCalendar
      summary: Rename the calendar or change who may invite (owner only)
      description: "Error codes: `invalid_name`, `forbidden`, `calendar_not_found`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/CalendarName"
                membersCanInvite:
                  type: boolean
                  description: Lets every member invite friends.
      responses:
        "200":
          description: The updated calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCalendar
      summary: Delete the calendar for everyone (owner only)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /calendars/{calendarId}/members:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
    post:
      operationId: inviteMember
      summary: Add a friend to the calendar
      description: |
        Open to the owner and to members who can invite. Only the caller's
        friends can be invited; they join right away, as viewers unless a role
        is given, and never with a higher role than the caller's.
        Error codes: `forbidden` (no invite right), `not_friends`,
        `user_not_found`, `already_member`, `invalid_role`, `role_too_high`,
        `calendar_full` (50 members).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
                role:
                  $ref: "#/components/schemas/MemberRole"
      responses:
        "200":
          description: The calendar with the new member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /calendars/{calendarId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateMember
      summary: Change a member's role or invite right (owner only)
      description: "Error codes: `forbidden`, `member_not_found`, `member_is_owner`, `invalid_role`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/MemberRole"
                canInvite:
                  type: boolean
      responses:
        "200":
          description: The updated calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMember
      summary: Remove a member (owner only), or leave with your own ID
      description: |
        Anyone but the owner can leave. Error codes: `forbidden`,
        `member_not_found`, `owner_must_transfer` (the owner tried to leave).
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /calendars/{calendarId}/transfer:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
    post:
      operationId: transferOwnership
      summary: Make another member the owner (owner only)
      description: |
        The previous owner stays on as an editor who can invite.
        Error codes: `forbidden`, `member_not_found`,
        `new_owner_too_many_calendars` (they already own 50).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The calendar afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /calendars/{calendarId}/entries:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
    get:
      operationId: listEntries
      summary: The entries of one month
      description: |
        Every entry that overlaps the month, so a trip from Oct 30 to Nov 2 is in
        both October and November.
      parameters:
        - name: month
          in: query
          required: true
          description: The month, as YYYY-MM.
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
            example: "2026-10"
      responses:
        "200":
          description: Entries by first date, then in the order they were added
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createEntry
      summary: Add an entry (owner and editors)
      description: |
        Error codes: `invalid_title`, `invalid_date`, `invalid_end_date` (before the
        start date, or more than 31 days long), `invalid_color`, `invalid_cover`,
        `forbidden`, `day_full` (20 entries on one of its days), `too_many_entries`
        (5000 in the calendar).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, date, color]
              properties:
                title:
                  $ref: "#/components/schemas/EntryTitle"
                date:
                  $ref: "#/components/schemas/EntryDate"
                endDate:
                  $ref: "#/components/schemas/EntryEndDate"
                color:
                  $ref: "#/components/schemas/EntryColor"
                cover:
                  description: Null or left out for no cover.
                  oneOf:
                    - $ref: "#/components/schemas/EntryCover"
                    - type: "null"
      responses:
        "201":
          description: The new entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /calendars/{calendarId}/entries/next:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
    get:
      operationId: getNextEntry
      summary: The next entry from a day on
      description: |
        The first entry that has not ended before `from`, for the "Next up" card:
        an entry that is still running on `from` comes first. Clients send their
        local today, since the server does not know their time zone.
        Error codes: `invalid_date`.
      parameters:
        - name: from
          in: query
          required: true
          description: The first day to look at, as YYYY-MM-DD.
          schema:
            type: string
            format: date
            example: "2026-10-24"
      responses:
        "200":
          description: The entry, or null when nothing is planned from that day on
          content:
            application/json:
              schema:
                type: object
                required: [entry]
                properties:
                  entry:
                    oneOf:
                      - $ref: "#/components/schemas/Entry"
                      - type: "null"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /calendars/{calendarId}/entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
      - $ref: "#/components/parameters/EntryId"
    get:
      operationId: getEntry
      summary: One entry
      description: "`entry_not_found` when it was deleted."
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateEntry
      summary: Change an entry (owner and editors)
      description: |
        Changing the start or end date clears everyone's answers. A new `date`
        without an `endDate` keeps the entry's length.
        Error codes as for creating, plus `entry_not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  $ref: "#/components/schemas/EntryTitle"
                date:
                  $ref: "#/components/schemas/EntryDate"
                endDate:
                  $ref: "#/components/schemas/EntryEndDate"
                color:
                  $ref: "#/components/schemas/EntryColor"
                cover:
                  description: Null removes the cover; left out, it stays.
                  oneOf:
                    - $ref: "#/components/schemas/EntryCover"
                    - type: "null"
      responses:
        "200":
          description: The updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteEntry
      summary: Delete an entry (owner and editors)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /calendars/{calendarId}/entries/{entryId}/response:
    parameters:
      - $ref: "#/components/parameters/CalendarId"
      - $ref: "#/components/parameters/EntryId"
    put:
      operationId: respondToEntry
      summary: Accept or decline an entry (every member)
      description: "Error codes: `invalid_status`, `entry_not_found`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/EntryResponseStatus"
      responses:
        "200":
          description: The entry with the new answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteEntryResponse
      summary: Take your answer back, so it is pending again
      responses:
        "200":
          description: The entry without the caller's answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /avatars/{userId}/{file}:
    get:
      operationId: getAvatar
      summary: An avatar image
      description: Public and cached for a year; the URL changes with every upload.
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: file
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The image
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    bearer:
      type: http
      scheme: bearer

  parameters:
    CalendarId:
      name: calendarId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: The other user.
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: "`rate_limited`; see the Retry-After header"
      headers:
        Retry-After:
          description: Seconds to wait
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unreachable]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    Platform:
      type: string
      enum: [web, ios, android]

    Username:
      type: string
      pattern: "^[a-z0-9_.]{3,20}$"
      description: Unique, 3–20 characters of a–z, 0–9, _ and . (input is lowercased).

    User:
      type: object
      required: [id, email, username, avatarUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          description: Null until picked after the first sign-in.
          oneOf:
            - $ref: "#/components/schemas/Username"
            - type: "null"
        avatarUrl:
          type: [string, "null"]
          format: uri
        createdAt:
          type: string
          format: date-time

    ApiToken:
      type: object
      required: [id, name, createdAt, lastUsedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          description: Null until the token is first used. Updated at most once a minute.
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: string
          format: date-time

    CreatedApiToken:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              description: "`fgc_` and 43 characters. Shown this one time only."
              type: string

    Session:
      type: object
      required: [id, deviceName, platform, createdAt, lastUsedAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        platform:
          $ref: "#/components/schemas/Platform"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: The session this request was made with.

    Person:
      description: Another user as the caller sees them; never includes the email.
      type: object
      required: [id, username, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Username"
        avatarUrl:
          type: [string, "null"]
          format: uri

    FriendshipStatus:
      description: |
        none; friends; outgoing (the caller asked, waiting for them);
        incoming (they asked the caller).
      type: string
      enum: [none, friends, outgoing, incoming]

    Friend:
      type: object
      required: [user, since]
      properties:
        user:
          $ref: "#/components/schemas/Person"
        since:
          type: string
          format: date-time

    FriendRequest:
      type: object
      required: [user, createdAt]
      properties:
        user:
          $ref: "#/components/schemas/Person"
        createdAt:
          type: string
          format: date-time

    CalendarName:
      type: string
      minLength: 1
      maxLength: 50
      description: Trimmed; 1–50 characters.

    Role:
      description: |
        owner: one per calendar, manages it and its members. editor: adds and
        edits entries. viewer: sees entries and answers them.
      type: string
      enum: [owner, editor, viewer]

    MemberRole:
      description: A role that can be given to a member; ownership is transferred instead.
      type: string
      enum: [editor, viewer]

    CalendarSummary:
      type: object
      required: [id, name, role, canInvite, memberCount, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        canInvite:
          type: boolean
          description: Whether the caller may invite friends.
        memberCount:
          type: integer
        members:
          description: The first 4 members, owner first.
          type: array
          items:
            $ref: "#/components/schemas/Person"

    Calendar:
      type: object
      required: [id, name, membersCanInvite, createdAt, role, canInvite, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        membersCanInvite:
          type: boolean
          description: Every member may invite, whatever their own invite right.
        createdAt:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/Role"
        canInvite:
          type: boolean
          description: Whether the caller may invite friends.
        members:
          description: Owner first, then editors, then viewers, each by username.
          type: array
          items:
            $ref: "#/components/schemas/CalendarMember"

    CalendarMember:
      type: object
      required: [user, role, canInvite, joinedAt]
      properties:
        user:
          $ref: "#/components/schemas/Person"
        role:
          $ref: "#/components/schemas/Role"
        canInvite:
          type: boolean
          description: The member's own invite right; always true for the owner.
        joinedAt:
          type: string
          format: date-time

    EntryTitle:
      type: string
      minLength: 1
      maxLength: 80
      description: Trimmed; 1–80 characters.

    EntryDate:
      type: string
      format: date
      description: A whole day, YYYY-MM-DD, from 2000-01-01 to 2099-12-31.

    EntryEndDate:
      type: string
      format: date
      description: |
        The entry's last day, YYYY-MM-DD. On or after `date`, and at most 30 days
        after it (31 days long). Defaults to `date` when creating.

    EntryColor:
      description: One of the preset entry colors.
      type: string
      enum: [fjord, sage, clay, rose, plum, sand, moss, slate]

    EntryCover:
      description: |
        One of the cover scenes. The client draws them; there are no uploads.
      type: string
      enum: [lake, mountains, beach, city, night_out, dinner, game_night]

    EntryResponseStatus:
      type: string
      enum: [accepted, declined]

    Entry:
      type: object
      required: [id, title, date, endDate, color, cover, createdBy, createdAt, updatedAt, accepted, declined]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        date:
          $ref: "#/components/schemas/EntryDate"
        endDate:
          $ref: "#/components/schemas/EntryEndDate"
        color:
          $ref: "#/components/schemas/EntryColor"
        cover:
          description: The cover scene; null for none.
          oneOf:
            - $ref: "#/components/schemas/EntryCover"
            - type: "null"
        createdBy:
          description: Who added it; null once their account is deleted.
          oneOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        accepted:
          description: IDs of members who accepted, in the order they answered.
          type: array
          items:
            type: string
            format: uuid
        declined:
          description: IDs of members who declined. Members in neither list have not answered.
          type: array
          items:
            type: string
            format: uuid
