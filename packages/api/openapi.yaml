openapi: 3.1.0
info:
  title: Friend Group Calendar API
  version: 0.3.0
  description: |
    HTTP API for the friend group calendar. This file is the contract between
    services/api (Go) and apps/client (TypeScript). After changing it, run
    `npm run gen:api` in apps/client to regenerate the typed client.

    Authentication: web clients get an HttpOnly `session` cookie from
    POST /auth/verify; native apps get a token in the response body and send
    it as `Authorization: Bearer <token>`. Sessions last 90 days and are
    renewed while in use.

    Every error response has the body `{"error": {"code", "message"}}`.
    `code` is stable and meant for the client to switch on.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose
security:
  - sessionCookie: []
  - bearer: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: API and database are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: API is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/request-code:
    post:
      operationId: requestCode
      summary: Email a 6-digit sign-in code
      description: |
        Returns a challenge ID that only this client receives; send it to
        /auth/verify together with the code. Codes expire after 10 minutes and
        allow 5 attempts, and stay valid when more codes are requested. The
        response is the same whether or not an account exists; the account is
        created on the first verify.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [challengeId]
                properties:
                  challengeId:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Error"

  /auth/verify:
    post:
      operationId: verifyCode
      summary: Exchange a code for a session
      description: |
        Error codes: `invalid_code` (wrong code, try again), `code_expired`
        (request a new code; also for an unknown challenge), `invalid_email`,
        `invalid_platform`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, email, code, platform]
              properties:
                challengeId:
                  type: string
                  format: uuid
                  description: From the /auth/request-code response.
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                platform:
                  $ref: "#/components/schemas/Platform"
                deviceName:
                  type: string
                  maxLength: 64
                  description: Shown in the device list. Derived from the user agent when omitted.
      responses:
        "200":
          description: Signed in. Web clients also receive the session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
                    description: Only for native platforms; keep it in secure storage.
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: Also succeeds without a session and always clears the cookie.
      responses:
        "204":
          description: Signed out

  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Update the profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  $ref: "#/components/schemas/Username"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: "`username_taken`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /username-availability:
    get:
      operationId: getUsernameAvailability
      summary: Check whether a username is free
      description: The caller's own current username counts as available.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /me/avatar:
    put:
      operationId: putAvatar
      summary: Upload a new avatar
      description: |
        JPEG, PNG, WebP or GIF up to 10 MB. The API center-crops it to a
        square, resizes it to 512 px and stores it as WebP.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAvatar
      summary: Remove the avatar
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"

  /me/sessions:
    get:
      operationId: listSessions
      summary: Devices that are signed in
      responses:
        "200":
          description: Active sessions, most recently used first
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"

  /me/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Sign one device out
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      summary: Sign out every other device
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Error"

  /users/search:
    get:
      operationId: searchUsers
      summary: Find people by username
      description: |
        Prefix search: "ad" finds ada and adam. A leading @ is ignored. At most
        20 results, exact match first, then shorter usernames. Never includes
        the caller or people who have not picked a username yet.
        Error codes: `invalid_query` (not 2–20 username characters),
        `username_required` (the caller has no username yet), `rate_limited`
        (more than 120 searches in an hour).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching people with the caller's friendship to each
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [user, friendship]
                      properties:
                        user:
                          $ref: "#/components/schemas/Person"
                        friendship:
                          $ref: "#/components/schemas/FriendshipStatus"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /friends:
    get:
      operationId: listFriends
      summary: Friends and pending friend requests
      responses:
        "200":
          description: Friends by username; requests newest first
          content:
            application/json:
              schema:
                type: object
                required: [friends, incoming, outgoing]
                properties:
                  friends:
                    type: array
                    items:
                      $ref: "#/components/schemas/Friend"
                  incoming:
                    description: Requests to the caller, waiting for them to accept or decline.
                    type: array
                    items:
                      $ref: "#/components/schemas/FriendRequest"
                  outgoing:
                    description: Requests the caller sent that are still pending.
                    type: array
                    items:
                      $ref: "#/components/schemas/FriendRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /friends/{userId}:
    delete:
      operationId: removeFriend
      summary: End a friendship
      description: "Error codes: `not_friends`, `user_not_found` (malformed ID)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: No longer friends
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /friend-requests:
    post:
      operationId: sendFriendRequest
      summary: Ask someone to be friends
      description: |
        If they already asked the caller, this accepts their request and the
        result is `friends`. Sending again while a request is pending, or to a
        friend, changes nothing. Error codes: `user_not_found`,
        `cannot_add_self`, `rate_limited` (30 requests an hour, 3 a day to the
        same person).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The friendship afterwards
          content:
            application/json:
              schema:
                type: object
                required: [friendship]
                properties:
                  friendship:
                    type: string
                    enum: [outgoing, friends]
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /friend-requests/{userId}:
    delete:
      operationId: deleteFriendRequest
      summary: Decline a request from this user, or cancel one sent to them
      description: "Error codes: `request_not_found`, `user_not_found` (malformed ID)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Request deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /friend-requests/{userId}/accept:
    post:
      operationId: acceptFriendRequest
      summary: Accept the request this user sent
      description: "Error codes: `request_not_found`, `user_not_found` (malformed ID)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Now friends
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /avatars/{userId}/{file}:
    get:
      operationId: getAvatar
      summary: An avatar image
      description: Public and cached for a year; the URL changes with every upload.
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: file
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The image
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    bearer:
      type: http
      scheme: bearer

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: The other user.
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: "`rate_limited`; see the Retry-After header"
      headers:
        Retry-After:
          description: Seconds to wait
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unreachable]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    Platform:
      type: string
      enum: [web, ios, android]

    Username:
      type: string
      pattern: "^[a-z0-9_.]{3,20}$"
      description: Unique, 3–20 characters of a–z, 0–9, _ and . (input is lowercased).

    User:
      type: object
      required: [id, email, username, avatarUrl, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          description: Null until picked after the first sign-in.
          oneOf:
            - $ref: "#/components/schemas/Username"
            - type: "null"
        avatarUrl:
          type: [string, "null"]
          format: uri
        createdAt:
          type: string
          format: date-time

    Session:
      type: object
      required: [id, deviceName, platform, createdAt, lastUsedAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: string
        platform:
          $ref: "#/components/schemas/Platform"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: The session this request was made with.

    Person:
      description: Another user as the caller sees them; never includes the email.
      type: object
      required: [id, username, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Username"
        avatarUrl:
          type: [string, "null"]
          format: uri

    FriendshipStatus:
      description: |
        none; friends; outgoing (the caller asked, waiting for them);
        incoming (they asked the caller).
      type: string
      enum: [none, friends, outgoing, incoming]

    Friend:
      type: object
      required: [user, since]
      properties:
        user:
          $ref: "#/components/schemas/Person"
        since:
          type: string
          format: date-time

    FriendRequest:
      type: object
      required: [user, createdAt]
      properties:
        user:
          $ref: "#/components/schemas/Person"
        createdAt:
          type: string
          format: date-time
