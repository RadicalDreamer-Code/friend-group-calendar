name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (gofmt, vet, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: calendar
          POSTGRES_PASSWORD: calendar
          POSTGRES_DB: calendar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calendar -d calendar"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # The database tests create and drop their own databases on this server.
      TEST_DATABASE_URL: postgres://calendar:calendar@localhost:5432/calendar?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  client:
    name: Client (lint, format, types, contrast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src scripts
      - run: npm run typecheck
      - run: npm run check:contrast

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: API (production)
        uses: docker/build-push-action@v7
        with:
          context: services/api
          target: prod
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web app (production)
        uses: docker/build-push-action@v7
        with:
          context: apps/client
          target: prod
          push: false
          build-args: EXPO_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
