# Local development stack. Start everything with `make up` (or `docker compose up --build`).
# Every value can be overridden in a .env file next to this one (see .env.example).
# Ports listen on 127.0.0.1 only; set HOST_BIND=0.0.0.0 to reach the API and web app from a phone.
name: friend-group-calendar

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calendar}
      POSTGRES_DB: ${POSTGRES_DB:-calendar}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Catches every email the API sends, like sign-in codes.
  # Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # S3-compatible object storage for avatars (R2 or S3 in production).
  # The API creates the bucket on startup.
  # Console: http://localhost:9001/rustfs/console/ (login: S3_ACCESS_KEY / S3_SECRET_KEY)
  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-calendar}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-calendar-dev-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data

  api:
    build:
      context: services/api
      target: dev
    environment:
      API_ADDR: ":8080"
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-calendar}:${POSTGRES_PASSWORD:-calendar}@db:5432/${POSTGRES_DB:-calendar}?sslmode=disable
      # Tests create and drop their own databases on this server.
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-calendar}:${POSTGRES_PASSWORD:-calendar}@db:5432/${POSTGRES_DB:-calendar}?sslmode=disable
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:8082}
      LOG_FORMAT: text
      # Development only. Production needs its own: `openssl rand -hex 32`.
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: Friend Calendar <hello@friend-calendar.localhost>
      S3_ENDPOINT: s3:9000
      S3_USE_SSL: "false"
      S3_BUCKET: avatars
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-calendar}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-calendar-dev-secret}
      S3_CREATE_BUCKET: "true"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      - ./services/api:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      s3:
        condition: service_started

  web:
    build:
      context: apps/client
    environment:
      WEB_PORT: ${WEB_PORT:-8082}
      EXPO_PUBLIC_API_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${WEB_PORT:-8082}:${WEB_PORT:-8082}"
    volumes:
      - ./apps/client:/app
      - /app/node_modules
      # Lets `npm run gen:api` inside the container find the OpenAPI spec.
      - ./packages:/packages:ro
    depends_on:
      - api

volumes:
  db-data:
  s3-data:
  go-mod-cache:
  go-build-cache:
